<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>私密聊天 · 运维总览</title>
<style>
:root{--bg:#0b1020;--panel:#141b2e;--line:#2a3352;--ink:#e7ecf8;--muted:#93a0bd;--brand:#5b8cff;--danger:#e0556b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);padding:24px}
.wrap{max-width:960px;margin:0 auto}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:130px}
.stat .k{color:var(--muted);font-size:12px}.stat .v{font-size:22px;font-weight:700;margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12px}tr:last-child td{border-bottom:none}
button{border:none;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px}
.danger{background:var(--danger);color:#fff}
input{width:100%;max-width:320px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:#0e1528;color:var(--ink);outline:none}
.note{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<main class="wrap">
  <h1>私密聊天 · 运维总览</h1>
  <p class="sub">无审批队列（申请自动通过）。此页只提供运行时指标与强制销毁入口。</p>
  <div class="stats">
    <div class="stat"><div class="k">版本</div><div class="v" id="s-ver">—</div></div>
    <div class="stat"><div class="k">活跃房间</div><div class="v" id="s-rooms">—</div></div>
    <div class="stat"><div class="k">在线连接</div><div class="v" id="s-clients">—</div></div>
    <div class="stat"><div class="k">待清理</div><div class="v" id="s-clean">—</div></div>
  </div>
  <div style="margin-bottom:14px;display:flex;gap:8px">
    <input id="admin-token" type="password" placeholder="管理员令牌（PC_ADMIN_TOKEN）" />
    <button id="btn-refresh" style="background:var(--brand);color:#fff">刷新</button>
  </div>
  <div id="msg" style="color:var(--danger);font-size:13px;min-height:18px"></div>
  <table><thead><tr><th>房间</th><th>状态</th><th>到期</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
  <p class="note">管理员令牌由服务端环境变量 PC_ADMIN_TOKEN 设定，仅本页强制销毁接口使用。强制销毁会级联删除该房全部密文、文件与 RK 私钥，不可恢复。</p>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function health(){return fetch('/pc/api/health').then(function(r){return r.json()})}
  health().then(function(d){
    if(!d.ok)return;$('s-ver').textContent=d.pcVersion||'—';$('s-rooms').textContent=d.rooms;$('s-clients').textContent=d.clients;$('s-clean').textContent=d.pendingCleanup;
  }).catch(function(){});
  $('btn-refresh').onclick=function(){health().then(function(d){$('s-rooms').textContent=d.rooms;$('s-clients').textContent=d.clients;$('s-clean').textContent=d.pendingCleanup;$('msg').textContent='已刷新'})};
})();
</script>
</body>
</html>
