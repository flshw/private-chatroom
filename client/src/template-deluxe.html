<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>私密聊天 · 豪华版</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="boot" class="screen">
  <div class="card">
    <div class="brand"><span class="dot"></span>私密聊天 <span class="deluxe-badge">豪华版</span></div>
    <div class="status" id="boot-status">正在校验房间凭证…</div>
  </div>
</div>

<div id="gate" class="screen hidden">
  <div class="card">
    <div class="brand"><span class="dot"></span><span id="gate-room">私密聊天</span> <span class="deluxe-badge">豪华版</span></div>
    <div class="meta-line"><span id="gate-remain">—</span> · <span id="gate-count">—</span></div>
    <label for="nickname">你的昵称</label>
    <input id="nickname" type="text" maxlength="24" autocomplete="off" placeholder="输入昵称后进入" />
    <button id="btn-enter" class="primary">进入房间</button>
    <button id="btn-spectate" class="tool-btn" style="width:100%;margin-top:8px">👁 申请唯一旁观席位</button>
    <div class="status" id="gate-status"></div>
    <div class="key-note" title="进入时在本机生成密钥对，私钥永不上传服务器">🔒 密钥仅存本机 · 3D / 语音 / 掼蛋全部端到端加密</div>
  </div>
</div>

<div id="chat" class="hidden">
  <canvas id="scene3d"></canvas>
  <header class="topbar">
    <div class="room-name"><span class="dot"></span><span id="room-name">私密聊天</span><span class="deluxe-badge">豪华版</span></div>
    <div class="top-meta"><span id="remain">—</span> · <span id="member-count">—</span></div>
    <button class="tool-btn" id="btn-game" disabled>🃏 掼蛋</button>
    <button class="tool-btn" id="btn-voice-live">🎧 全双工语音</button>
    <button class="icon" id="btn-members" title="成员列表">成员</button>
    <button class="icon exit" id="btn-exit" title="退出房间（清除本机密钥）">退出</button>
  </header>
  <div class="main">
    <div id="messages" class="messages"></div>
    <aside id="members-panel" class="members hidden">
      <div class="members-title">在线成员 <span id="safety-code" class="code" title="全体公钥指纹短码，可与朋友线下比对">—</span></div>
      <div id="members-list"></div>
    </aside>
  </div>
  <footer class="composer">
    <button class="icon" id="btn-attach" title="发送文件（端到端加密）">📎</button>
    <button class="icon" id="btn-voice" title="录制语音条（端到端加密）">🎤</button>
    <button class="icon" id="btn-video" title="房间内视频通话（P2P 加密）">📹</button>
    <button class="icon" id="btn-export" title="导出聊天记录">导出</button>
    <input id="input" type="text" placeholder="输入消息，Enter 发送" autocomplete="off" />
    <button id="btn-send" class="primary">发送</button>
  </footer>
  <input type="file" id="file-input" class="hidden" />

  <div id="game-panel" class="hidden">
    <div id="card-counter"><span class="cc-title">记牌器 · 剩余</span></div>
    <div class="game-top">
      <span class="title">🃏 掼蛋</span>
      <span class="level" id="game-level">打 2</span>
      <span class="spacer"></span>
    </div>
    <div id="spectator-note" class="spectator-note hidden"></div>
    <div class="game-seats" id="game-seats"></div>
    <div class="game-table" id="game-table"><div class="tip">点击「掼蛋」选择玩家后开局</div></div>
    <div class="my-hand" id="my-hand"></div>
    <div class="game-actions"><span style="font-size:11px;color:var(--muted)">点选手牌后点下方「出牌」，牌局数据全程端到端加密</span></div>
    <div class="game-log" id="game-log"></div>
    <div class="game-bottom">
      <button class="tool-btn" id="btn-game-pass">过牌</button>
      <button class="tool-btn" id="btn-game-play">出牌</button>
    </div>
  </div>
  <div id="game-setup-mask" class="hidden"></div>
  <div id="game-setup" class="hidden">
    <div class="setup-title">选择另外 3 名玩家（已按人数规则预选，点击可调整）</div>
    <div id="player-picks"></div>
    <div class="setup-foot">
      <button class="tool-btn" id="btn-game-start">开局（0/3）</button>
      <button class="tool-btn" id="btn-setup-close">取消</button>
    </div>
  </div>
</div>

<div id="video-overlay" class="hidden">
  <div id="video-grid"></div>
  <button id="btn-hangup" class="danger">挂断</button>
</div>

<div id="pip-video" class="hidden">
  <div id="pip-head"><span class="live"></span>实时画面 <span style="flex:1"></span><button id="btn-pip-close" class="danger" style="padding:2px 8px;font-size:11px">关闭</button></div>
  <div id="pip-body"><div id="pip-empty" class="pip-empty">开启语音/视频后显示画面</div></div>
</div>

<div id="toast" class="toast hidden"></div>
